openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Torgima — Deterministic Execution Operating System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: me
    description: Current user profile and settings
  - name: onboarding
    description: Onboarding flow
  - name: blueprints
    description: Goal blueprints — the core execution unit
  - name: orders
    description: Task orders — individual execution items
  - name: feedback
    description: Feedback submission and interrogation
  - name: signals
    description: Signal system — behavioral performance metrics
  - name: state
    description: Dashboard state aggregation
  - name: bhudhi
    description: Bhudhi AI intelligence layer
  - name: validation
    description: Goal validation engine
  - name: notifications
    description: Notification history

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthenticated
    patch:
      operationId: updateMe
      tags: [me]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /me/settings:
    get:
      operationId: getSettings
      tags: [me]
      summary: Get user settings
      responses:
        "200":
          description: User settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
    patch:
      operationId: updateSettings
      tags: [me]
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"

  /onboarding/status:
    get:
      operationId: getOnboardingStatus
      tags: [onboarding]
      summary: Get onboarding completion status
      responses:
        "200":
          description: Onboarding status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"

  /onboarding/goal:
    post:
      operationId: submitOnboardingGoal
      tags: [onboarding]
      summary: Submit goal — structures, validates, and returns execution paths
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingGoalInput"
      responses:
        "200":
          description: Goal structured and validated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingGoalResult"

  /blueprints:
    get:
      operationId: listBlueprints
      tags: [blueprints]
      summary: List all blueprints for current user
      responses:
        "200":
          description: List of blueprints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Blueprint"
    post:
      operationId: createBlueprint
      tags: [blueprints]
      summary: Create a new blueprint draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueprintInput"
      responses:
        "201":
          description: Blueprint draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintCreateResult"

  /blueprints/history:
    get:
      operationId: getBlueprintHistory
      tags: [blueprints]
      summary: Get completed blueprint history
      responses:
        "200":
          description: Blueprint history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Blueprint"

  /blueprints/{id}:
    get:
      operationId: getBlueprint
      tags: [blueprints]
      summary: Get a specific blueprint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Blueprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blueprint"
        "404":
          description: Not found

  /blueprints/{id}/activate:
    post:
      operationId: activateBlueprint
      tags: [blueprints]
      summary: Activate a blueprint with a selected validation path
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateBlueprintInput"
      responses:
        "200":
          description: Blueprint activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintActivateResult"

  /blueprints/select-tier:
    post:
      operationId: postBlueprintsSelectTier
      tags: [blueprints]
      summary: Select execution tier, generate blueprint chain, and activate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectTierInput"
      responses:
        "200":
          description: Blueprint launched after tier selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectTierLaunchResult"

  /blueprints/{id}/tier-preview:
    get:
      operationId: getBlueprintTierPreview
      tags: [blueprints]
      summary: List tier preview cards for a blueprint validation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Tier preview cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TierPreviewListResponse"

  /blueprints/{id}/state:
    get:
      operationId: getBlueprintState
      tags: [blueprints]
      summary: Get the full runtime state of an active blueprint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Blueprint state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlueprintState"

  /blueprints/{id}/command-center:
    get:
      operationId: getBlueprintCommandCenter
      tags: [blueprints]
      summary: Full blueprint execution command center (hierarchy, locks, signals, policies)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Aggregated execution command center projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionCommandCenter"

  /blueprints/{id}/execution-feed:
    get:
      operationId: getBlueprintExecutionFeed
      tags: [blueprints]
      summary: Operational event stream / execution loop timeline for a blueprint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 80
            maximum: 150
      responses:
        "200":
          description: Ordered event rows (audit + loop stages); causation IDs appear in payloads when supplied
          content:
            application/json:
              schema:
                type: object
                description: Wrapped API response
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    required: [blueprintId, events]
                    properties:
                      blueprintId:
                        type: string
                        format: uuid
                      events:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
        "404":
          description: Blueprint not found

  /blueprints/{id}/pause:
    post:
      operationId: pauseBlueprint
      tags: [blueprints]
      summary: Pause an active blueprint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PauseInput"
      responses:
        "200":
          description: Blueprint paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blueprint"

  /blueprints/{id}/resume:
    post:
      operationId: resumeBlueprint
      tags: [blueprints]
      summary: Resume a paused blueprint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Blueprint resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blueprint"

  /validation/complete:
    post:
      operationId: postValidationComplete
      tags: [validation]
      summary: Ensure tier preview cards exist after validation completes
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                validationId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Validation row and tier previews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationCompleteResult"

  /validation/run:
    post:
      operationId: runValidation
      tags: [validation]
      summary: Run goal validation — scores, verdict, and three execution paths
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationInput"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResultP5"
    get:
      operationId: getValidationResult
      tags: [validation]
      summary: Get stored validation result for a blueprint
      parameters:
        - name: blueprintId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stored validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResultP5"

  /orders/active:
    get:
      operationId: getActiveOrders
      tags: [orders]
      summary: Get the current active orders for the user
      responses:
        "200":
          description: Active orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get a specific order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/start:
    post:
      operationId: startOrder
      tags: [orders]
      summary: Mark an order as started
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/finish:
    post:
      operationId: finishOrder
      tags: [orders]
      summary: Mark an order as finished (triggers feedback flow)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/block:
    post:
      operationId: blockOrder
      tags: [orders]
      summary: Mark an order as blocked
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockInput"
      responses:
        "200":
          description: Order blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/pause:
    post:
      operationId: pauseOrder
      tags: [orders]
      summary: Pause an in-progress order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/resume:
    post:
      operationId: resumeOrder
      tags: [orders]
      summary: Resume a paused order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /feedback/task:
    post:
      operationId: submitTaskFeedback
      tags: [feedback]
      summary: Submit feedback for a completed task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskFeedbackInput"
      responses:
        "201":
          description: Feedback submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"

  /feedback/{id}/interrogation:
    get:
      operationId: getFeedbackInterrogation
      tags: [feedback]
      summary: Get Bhudhi interrogation questions for a feedback entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Interrogation questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interrogation"
    post:
      operationId: answerFeedbackInterrogation
      tags: [feedback]
      summary: Answer feedback interrogation question
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer:
                  type: string
                idempotencyKey:
                  type: string
      responses:
        "200":
          description: Interrogation answered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessEnvelope"

  /feedback/weekly-review:
    post:
      operationId: submitWeeklyReview
      tags: [feedback]
      summary: Submit weekly review feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeeklyReviewInput"
      responses:
        "201":
          description: Weekly review submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"

  /signals/current:
    get:
      operationId: getCurrentSignals
      tags: [signals]
      summary: Get current signal state for the user
      responses:
        "200":
          description: Current signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalState"

  /signals/history:
    get:
      operationId: getSignalHistory
      tags: [signals]
      summary: Get signal history snapshots
      responses:
        "200":
          description: Signal history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SignalSnapshot"

  /state/dashboard:
    get:
      operationId: getDashboardState
      tags: [state]
      summary: Get full dashboard state — active blueprint, orders, signals, conditions
      responses:
        "200":
          description: Dashboard state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardState"

  /bhudhi/structure-goal:
    post:
      operationId: structureGoal
      tags: [bhudhi]
      summary: Ask Bhudhi to structure a raw goal into a blueprint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "200":
          description: Structured goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StructuredGoal"

  /bhudhi/explain-state:
    post:
      operationId: explainState
      tags: [bhudhi]
      summary: Ask Bhudhi to explain the current system state in plain language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplainStateInput"
      responses:
        "200":
          description: State explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateExplanation"

  /execution/active-order:
    get:
      operationId: getExecutionActiveOrder
      tags: [orders]
      summary: Get active execution order for current user
      responses:
        "200":
          description: Active order payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessEnvelope"
        "404":
          description: No active order

  /execution/feedback:
    post:
      operationId: submitExecutionFeedback
      tags: [feedback]
      summary: Submit feedback via primary execution loop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionFeedbackInput"
      responses:
        "200":
          description: Feedback processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessEnvelope"

  /execution/next-task:
    post:
      operationId: requestNextExecutionTask
      tags: [orders]
      summary: Request next task in execution loop
      responses:
        "200":
          description: Next task generation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessEnvelope"

  /execution/help:
    post:
      operationId: requestExecutionHelp
      tags: [orders]
      summary: Request contextual execution help
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Help response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessEnvelope"

  /condition/current:
    get:
      operationId: getCurrentCondition
      tags: [signals]
      summary: Get current condition state
      responses:
        "200":
          description: Current condition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessEnvelope"

  /orders/{id}/feedback:
    post:
      operationId: submitOrderFeedback
      tags: [feedback]
      summary: Submit feedback for an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderFeedbackInput"
      responses:
        "200":
          description: Feedback result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessEnvelope"

  /onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [onboarding]
      summary: Mark onboarding complete
      responses:
        "200":
          description: Onboarding completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessEnvelope"

  /auth/session:
    get:
      operationId: getAuthSession
      tags: [me]
      summary: Get current auth session
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessEnvelope"

  /auth/send-magic-link:
    post:
      operationId: sendMagicLink
      tags: [me]
      summary: Send magic link login email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Magic link sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessEnvelope"

  /notifications/history:
    get:
      operationId: getNotificationHistory
      tags: [notifications]
      summary: Get notification history
      responses:
        "200":
          description: Notification history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

components:
  schemas:
    ApiSuccessEnvelope:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true

    ExecutionFeedbackInput:
      type: object
      required: [orderId, blueprintId, completionStatus]
      properties:
        orderId:
          type: string
          format: uuid
        blueprintId:
          type: string
          format: uuid
        completionStatus:
          type: string
          enum: [completed, partial, failed, skipped]
        score:
          type: integer
          minimum: 0
          maximum: 10
        feedbackText:
          type: string
        proofJson:
          type: object
          additionalProperties: true
        blockerJson:
          type: object
          additionalProperties: true
        idempotencyKey:
          type: string

    OrderFeedbackInput:
      type: object
      required: [completionStatus, score, reflection, idempotencyKey]
      properties:
        completionStatus:
          type: string
          enum: [completed, partial, failed, skipped]
        score:
          type: integer
        reflection:
          type: string
        difficultyFelt:
          type: string
          enum: [very_easy, easy, moderate, hard, very_hard]
        proofJson:
          type: object
          additionalProperties: true
        blockerJson:
          type: object
          additionalProperties: true
        idempotencyKey:
          type: string
        expectedStateVersion:
          type: integer

    OrderFeedbackResult:
      type: object
      required: [feedbackId, verdictStatus, weightedScore, confidence, requiresInterrogation, eventId]
      properties:
        feedbackId:
          type: string
          format: uuid
        verdictStatus:
          type: string
          enum: [accepted, needs_interrogation, rejected]
        weightedScore:
          type: number
        confidence:
          type: string
          enum: [high, medium, low]
        requiresInterrogation:
          type: boolean
        interrogationQuestion:
          type: string
        nextStep:
          type: string
          enum: [answer_question, loop_running]
        message:
          type: string
        eventId:
          type: string

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    User:
      type: object
      required:
        - id
        - email
        - mode
        - tier
        - onboardingComplete
        - timezone
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: ["string", "null"]
          description: User-chosen display name (from `display_name`).
        mode:
          type: string
        tier:
          type: string
        onboardingComplete:
          type: boolean
        timezone:
          type: string
        notificationPreferences:
          type: object
          additionalProperties: true

    UserUpdate:
      type: object
      properties:
        display_name:
          type: string
        timezone:
          type: string

    UserSettings:
      type: object
      required: [userId, dailyTaskTarget, notificationsEnabled]
      properties:
        userId:
          type: string
        dailyTaskTarget:
          type: integer
        notificationsEnabled:
          type: boolean
        weeklyReviewDay:
          type: ["string", "null"]

    UserSettingsUpdate:
      type: object
      properties:
        dailyTaskTarget:
          type: integer
        notificationsEnabled:
          type: boolean
        weeklyReviewDay:
          type: string

    OnboardingStatus:
      type: object
      required: [completed, step]
      properties:
        completed:
          type: boolean
        step:
          type: string
        blueprintId:
          type: ["string", "null"]

    OnboardingGoalInput:
      type: object
      required: [rawGoal, idempotencyKey]
      properties:
        rawGoal:
          type: string
        purpose:
          type: ["string", "null"]
        timeframe:
          type: ["string", "null"]
        commitmentLevel:
          type: ["string", "null"]
          enum: [low, medium, high, full, null]
        currentContext:
          type: ["string", "null"]
        successSignal:
          type: ["string", "null"]
        knownBlockers:
          type: ["string", "null"]
        domainHints:
          type: array
          items:
            type: string
        idempotencyKey:
          type: string

    OnboardingGoalResult:
      type: object
      required: [status, blueprintId]
      properties:
        status:
          type: string
          enum: [invalid, needs_clarification, validated]
        blueprintId:
          type: string
        validationId:
