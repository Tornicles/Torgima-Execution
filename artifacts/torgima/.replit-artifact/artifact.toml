kind = "web"
previewPath = "/"
title = "Torgima"
version = "1.0.0"
id = "artifacts/torgima"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26136

[services.development]
run = "pnpm --filter @workspace/torgima run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/torgima", "run", "build" ]
publicDir = "artifacts/torgima/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26136"
BASE_PATH = "/"
