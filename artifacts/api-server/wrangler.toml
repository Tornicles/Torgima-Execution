name = "torgima"
main = "src/worker.ts"
workers_dev = true
compatibility_date = "2026-02-01"
compatibility_flags = [
  "nodejs_compat",
  "enable_nodejs_http_modules",
  "enable_nodejs_http_server_modules"
]

[alias]
"node:fs" = "./src/shims/node-fs.ts"
"pino-http" = "./src/shims/pino-http-stub.ts"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
NODE_ENV = "production"
TORGIMA_RUNTIME = "cloudflare"
APP_URL = "https://torgima.com"
FRONTEND_URL = "https://torgima.com"

# ── Launch Mode ─────────────────────────────────────────────────────────────
# LAUNCH_MODE=true enables MVP-safe lazy initialization:
#   - signup/login only create auth + profile
#   - upgrade/status returns starter defaults without hitting upgrade tables
#   - all heavy cron/background jobs are skipped
#   - missing optional data never blocks rendering
# Set to "false" when the platform is stable and all features are ready.
LAUNCH_MODE = "true"

# ── Auth ─────────────────────────────────────────────────────────────────────
# Magic link disabled — Supabase email/password auth is now the default.
# Set to "true" in Cloudflare secrets to re-enable (not recommended).
ENABLE_MAGIC_LINK_AUTH = "false"

# ── Event Dispatch Cron ──────────────────────────────────────────────────────
# Keep disabled in launch mode to prevent "Too many subrequests" Worker errors.
EVENT_DISPATCH_CRON_ENABLED = "false"
EVENT_DISPATCH_CRON_BATCH_SIZE = "1"

# ── Advanced Feature Gates ───────────────────────────────────────────────────
# Upgrade gate advanced logic (archive queries, migration checks)
ENABLE_ADVANCED_UPGRADE_GATE = "false"
# Background Bhudhi civilization / identity systems
ENABLE_BACKGROUND_BHUDHI = "false"
# Team creation/bootstrap on user signup
ENABLE_TEAM_BOOTSTRAP = "false"
# Signal engine auto-bootstrap on blueprint launch
ENABLE_SIGNAL_AUTO_BOOTSTRAP = "false"

# SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
# are set as encrypted secrets in the Cloudflare dashboard — never put them here.

[[routes]]
pattern = "api.torgima.com/*"
zone_name = "torgima.com"

[[kv_namespaces]]
binding = "SESSIONS"
id = "aa13fb8cb21d44aa965fbcc7cc9ea1f7"

# Queues: create torgima-task-queue in Cloudflare dashboard, then uncomment:
# [[queues.producers]]
# binding = "TASK_QUEUE"
# queue = "torgima-task-queue"
# [[queues.consumers]]
# queue = "torgima-task-queue"
# max_batch_size = 10
# max_batch_timeout = 30
# max_retries = 10

[triggers]
crons = [ "0 2 * * *", "*/30 * * * *", "0 3 * * *", "*/10 * * * *", "* * * * *" ]
