name = "torgima"
main = "src/worker.ts"
compatibility_date = "2026-02-01"
compatibility_flags = [
  "nodejs_compat",
  "enable_nodejs_http_modules",
  "enable_nodejs_http_server_modules"
]

[alias]
"node:fs" = "./src/shims/node-fs.ts"
"pino-http" = "./src/shims/pino-http-stub.ts"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
NODE_ENV = "production"
TORGIMA_RUNTIME = "cloudflare"
APP_URL = "https://torgima-frontend.pages.dev"

[[kv_namespaces]]
binding = "SESSIONS"
id = "aa13fb8cb21d44aa965fbcc7cc9ea1f7"

# Queues: create torgima-task-queue in Cloudflare dashboard, then uncomment:
# [[queues.producers]]
# binding = "TASK_QUEUE"
# queue = "torgima-task-queue"
# [[queues.consumers]]
# queue = "torgima-task-queue"
# max_batch_size = 10
# max_batch_timeout = 30
# max_retries = 10

[triggers]
crons = [ "0 2 * * *", "*/30 * * * *", "0 3 * * *", "*/10 * * * *", "* * * * *" ]
