packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - packages/*
  - scripts

allowBuilds:
  esbuild: true
  "@swc/core": true
  msw: true
  unrs-resolver: true
  protobufjs: set this to true or false
  '@embedded-postgres/windows-x64': true
  embedded-postgres: true
  sharp: set this to true or false
  workerd: true
  puppeteer: set this to true or false

# pnpm 11+ (strictDepBuilds default true) fails non-interactive CI when deps need build scripts
# not listed above. Use `pnpm approve-builds` locally to grow the list over time.
strictDepBuilds: false

autoInstallPeers: false

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.35.1
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.5.0
  tailwindcss: ^4.1.14
  tsx: 4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

minimumReleaseAge: 1440

overrides:
  # Keep one React type tree site-wide — marketing (Next/eslint) pulled @types/react@18 otherwise.
  '@types/react': '^19.2.0'
  '@types/react-dom': '^19.2.0'
  '@esbuild-kit/esm-loader': npm:tsx@^4.21.0
  '@expo/ngrok-bin>@expo/ngrok-bin-darwin-arm64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-darwin-x64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-freebsd-ia32': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-freebsd-x64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-linux-arm': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-linux-arm64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-linux-ia32': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-sunos-x64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-win32-ia32': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-win32-x64': '-'
  brace-expansion@>=2.0.0 <2.0.3: '>=2.0.3'
  esbuild: 0.27.3
  fast-uri@<=3.1.0: '>=3.1.1'
  fast-uri@<=3.1.1: '>=3.1.2'
  lodash@<=4.17.23: '>=4.18.0'
  lodash@>=4.0.0 <=4.17.23: '>=4.18.0'
  path-to-regexp@>=8.0.0 <8.4.0: '>=8.4.0'
  picomatch@<2.3.2: '>=2.3.2 <3'
  picomatch@>=4.0.0 <4.0.4: '>=4.0.4'
  postcss@<8.5.10: '>=8.5.10'
  yaml@>=2.0.0 <2.8.3: '>=2.8.3'
