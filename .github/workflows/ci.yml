name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Diagnostics
        run: node --version && pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build workspaces
        run: pnpm run build

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API unit + phase9 logic tests
        run: pnpm -F @workspace/api-server exec vitest run src/tests/unit src/tests/e2e/phase9/error-taxonomy.test.ts src/tests/e2e/phase9/edge-cases.test.ts
        env:
          TORGIMA_INTEGRATION: "false"

  phase9-integration:
    name: Phase 9 E2E (Postgres)
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: torgima_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/torgima_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/torgima_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/torgima_test
      RAILWAY_API_URL: ${{ vars.RAILWAY_API_URL || secrets.RAILWAY_API_URL || '' }}
      TORGIMA_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Postgres client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Wait for Postgres readiness
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres -d torgima_test && exit 0
            sleep 2
          done
          echo "Postgres did not become ready" >&2
          exit 1
      - name: Apply database schema to test database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          pnpm db:ci
      - name: Wait for Railway API and onboarding schema readiness
        run: |
          if [ -z "$RAILWAY_API_URL" ]; then
            echo "RAILWAY_API_URL is not configured; skipping external Railway readiness check for local Postgres E2E."
            exit 0
          fi
          pnpm -F @workspace/scripts run wait:url -- --url "$RAILWAY_API_URL/api/healthz" --label "Railway healthz" --timeout-ms 120000 --interval-ms 3000
          curl -fsS "$RAILWAY_API_URL/api/health" >/tmp/railway-health.json
          pnpm -F @workspace/scripts run wait:url -- --url "$RAILWAY_API_URL/api/health/schema" --label "onboarding schema readiness" --timeout-ms 120000 --interval-ms 3000
      - name: Phase 9 scenario suite
        run: pnpm -F @workspace/api-server exec vitest run src/tests/e2e/phase9/scenarios.test.ts

  playwright:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm -F @workspace/torgima exec playwright install chromium --with-deps
      - name: Build frontend
        run: pnpm -F @workspace/torgima run build
        env:
          VITE_API_BASE_URL: ${{ vars.RAILWAY_API_URL || secrets.RAILWAY_API_URL || '' }}
      - name: Run Playwright against preview
        run: |
          echo "Testing preview URL: $PREVIEW_URL"
          echo "Testing API URL: ${RAILWAY_API_URL:-not configured}"
          if [ "$PREVIEW_URL" = "http://127.0.0.1:4173" ]; then
            pnpm -F @workspace/torgima exec vite preview --port 4173 --host 127.0.0.1 &
          fi
          pnpm -F @workspace/scripts run wait:url -- --url "$PREVIEW_URL" --method GET --label "frontend preview" --timeout-ms 120000 --interval-ms 3000
          curl -I "$PREVIEW_URL"
          if [ -n "$RAILWAY_API_URL" ]; then
            pnpm -F @workspace/scripts run wait:url -- --url "$RAILWAY_API_URL/api/healthz" --label "Railway healthz" --timeout-ms 120000 --interval-ms 3000
            curl -fsS "$RAILWAY_API_URL/api/health" >/tmp/api-health.json
            pnpm -F @workspace/scripts run wait:url -- --url "$RAILWAY_API_URL/api/health/schema" --label "onboarding API readiness" --timeout-ms 120000 --interval-ms 3000
          elif [ "$PREVIEW_URL" != "http://127.0.0.1:4173" ]; then
            curl -fsS "$PREVIEW_URL/api/health" >/tmp/api-health.json
          else
            echo "No Railway API URL configured; local preview smoke will verify static routing only."
          fi
          pnpm -F @workspace/torgima exec playwright test tests/e2e
        env:
          PREVIEW_URL: ${{ vars.PLAYWRIGHT_PREVIEW_URL || 'http://127.0.0.1:4173' }}
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_PREVIEW_URL || 'http://127.0.0.1:4173' }}
          RAILWAY_API_URL: ${{ vars.RAILWAY_API_URL || secrets.RAILWAY_API_URL || '' }}
