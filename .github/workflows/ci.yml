name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Diagnostics
        run: node --version && pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate migration scripts syntax
        run: |
          node --check scripts/apply-all-manual-migrations.mjs
          echo "Migration script syntax OK"

      - name: Build shared TypeScript project references
        run: pnpm run typecheck:libs

      - name: Typecheck api-server
        run: pnpm -F @workspace/api-server run typecheck

      - name: Typecheck frontend workspaces
        run: |
          pnpm -F @workspace/torgima run typecheck
          pnpm -F @workspace/torgima-mobile run typecheck

      - name: Typecheck scripts
        run: pnpm -F @workspace/scripts run typecheck

      - name: Build workspaces
        run: pnpm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: API unit + phase9 logic tests
        run: pnpm -F @workspace/api-server exec vitest run src/tests/unit src/tests/e2e/phase9/error-taxonomy.test.ts src/tests/e2e/phase9/edge-cases.test.ts
        env:
          TORGIMA_INTEGRATION: "false"

  phase9-integration:
    name: Phase 9 E2E (Postgres)
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: torgima_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/torgima_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/torgima_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/torgima_test
      TORGIMA_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Validate migration scripts syntax
        run: |
          node --check scripts/apply-all-manual-migrations.mjs
          echo "Migration script syntax OK"
      - name: Install Postgres client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Wait for Postgres readiness
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres -d torgima_test && exit 0
            sleep 2
          done
          echo "Postgres did not become ready" >&2
          exit 1
      - name: Apply database schema to test database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          pnpm db:ci
      - name: Phase 9 scenario suite
        run: pnpm -F @workspace/api-server exec vitest run src/tests/e2e/phase9/scenarios.test.ts --testTimeout=120000 --hookTimeout=120000
        env:
          CI: "true"
      - name: Security suite (unit)
        run: pnpm -F @workspace/api-server exec vitest run src/tests/security/torgima-security-suite.test.ts
      - name: DB healing diagnostics (read-only)
        run: pnpm -F @workspace/scripts heal:db

  playwright:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm -F @workspace/torgima exec playwright install chromium --with-deps
      - name: Build frontend
        run: pnpm -F @workspace/torgima run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.torgima.com' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Run Playwright against preview
        run: |
          echo "Testing preview URL: $PREVIEW_URL"
          echo "Testing API URL: ${PRODUCTION_API_URL}"
          if [ "$PREVIEW_URL" = "http://127.0.0.1:4173" ]; then
            pnpm -F @workspace/torgima exec vite preview --port 4173 --host 127.0.0.1 &
          fi
          pnpm -F @workspace/scripts run wait:url -- --url "$PREVIEW_URL" --method GET --label "frontend preview" --timeout-ms 120000 --interval-ms 3000
          curl -I "$PREVIEW_URL"
          if [ "$PREVIEW_URL" != "http://127.0.0.1:4173" ]; then
            curl -fsS "$PRODUCTION_API_URL/health" >/tmp/api-health.json || true
          else
            echo "Local preview smoke — static routing only."
          fi
          pnpm -F @workspace/torgima exec playwright test tests/e2e
        env:
          PREVIEW_URL: ${{ vars.PLAYWRIGHT_PREVIEW_URL || 'http://127.0.0.1:4173' }}
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_PREVIEW_URL || 'http://127.0.0.1:4173' }}
          PRODUCTION_API_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.torgima.com' }}
