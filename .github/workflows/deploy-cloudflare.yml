name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.torgima.com' }}
  # workers.dev bypasses zone WAF — used for CI health verification only
  WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}

jobs:
  ci:
    name: Typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          NODE_ENV: production

      - name: Run tests
        run: pnpm test
        env:
          NODE_ENV: test

      - name: Upload API build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: artifacts/api-server/dist
          retention-days: 1
          if-no-files-found: warn

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: artifacts/torgima/dist
          retention-days: 1

  migrate:
    name: Run database migrations
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      migrations-ran: ${{ steps.check-changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need previous commit to diff migration files

      # Egress guard: only connect to the production database when migration
      # files actually changed (or on a manual run). Avoids hammering Supabase
      # on every push when no schema change happened.
      - name: Check if migration files changed
        id: check-changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null \
            | grep -E "(^|/)migrations/|\.sql$|db:migrate|apply-manual" \
            | wc -l)
          TRIGGER="${{ github.event_name }}"
          if [ "$CHANGED" -gt "0" ] || [ "$TRIGGER" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Migration files changed or manual trigger — running migrations"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No migration files changed — skipping migrations (no DB egress)"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check-changes.outputs.changed == 'true'

      - uses: actions/setup-node@v4
        if: steps.check-changes.outputs.changed == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        if: steps.check-changes.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Migration idempotency precheck
        if: steps.check-changes.outputs.changed == 'true'
        run: pnpm db:migration-precheck

      - name: Run Drizzle migrations
        if: steps.check-changes.outputs.changed == 'true'
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run manual migrations
        if: steps.check-changes.outputs.changed == 'true'
        run: pnpm db:apply-manual
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Migration summary
        run: |
          if [ "${{ steps.check-changes.outputs.changed }}" = "true" ]; then
            echo "Migrations ran (migration files changed or manual trigger)"
          else
            echo "Migrations skipped — no migration files changed, zero DB egress"
          fi

  deploy-worker:
    name: Deploy API Worker
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API Worker
        run: pnpm --filter @workspace/api-server build
        env:
          NODE_ENV: production

      - name: Validate Worker DATABASE_URL (pooler required)
        run: node scripts/validate-worker-database-url.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify Worker entry and build output
        run: |
          test -f artifacts/api-server/src/worker.ts
          ls -la artifacts/api-server/dist/ | head -20 || true
          echo "Worker entry src/worker.ts present; Wrangler bundles TypeScript at deploy."

      - name: Ensure Cloudflare Queues
        run: pnpm run ensure:cloudflare:queues -- --soft
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QUEUES_OPTIONAL: "1"

      - name: Ensure WAF skip for health and CI probes
        run: pnpm run ensure:cloudflare:waf-ci-skip -- --soft
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ZONE_NAME: torgima.com

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: artifacts/api-server
          command: deploy
          # Only upload secrets that are stored in GitHub.
          # SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, and
          # BHUDHI_MODEL are managed directly in the Cloudflare dashboard and
          # must NOT be listed here — an empty GitHub secret causes wrangler to fail.
          secrets: |
            DATABASE_URL
            ANTHROPIC_API_KEY
            RESEND_API_KEY
            EMAIL_FROM
            INTERNAL_AUTH_SECRET
            NOTIFICATION_UNSUBSCRIBE_SECRET
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          INTERNAL_AUTH_SECRET: ${{ secrets.INTERNAL_AUTH_SECRET }}
          NOTIFICATION_UNSUBSCRIBE_SECRET: ${{ secrets.NOTIFICATION_UNSUBSCRIBE_SECRET }}

      - name: Verify Worker responds (workers.dev — bypasses zone WAF)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          WORKER_BASE="${WORKER_URL:-https://torgima.tmagaya.workers.dev}"
          HEALTH_URL="${WORKER_BASE}/health"
          echo "Health URL: ${HEALTH_URL} (workers.dev — not subject to zone WAF)"
          sleep 20

          SUCCESS=false
          for i in 1 2 3 4 5 6; do
            echo "--- Attempt $i ---"
            RAW="$(curl -sS -w "\n%{http_code}" --max-time 15 \
              -H "User-Agent: GitHub-Actions-Deploy-Verify/1.0" \
              "${HEALTH_URL}" || true)"
            HTTP_CODE="$(echo "${RAW}" | tail -1)"
            BODY="$(echo "${RAW}" | head -n -1)"

            echo "HTTP: ${HTTP_CODE}"
            echo "Body: ${BODY}"

            if [ "${HTTP_CODE}" = "200" ] && echo "${BODY}" | grep -q '"ok"'; then
              echo "✓ Worker is live on workers.dev"
              SUCCESS=true
              break
            fi

            if [ $i -lt 6 ]; then
              echo "Not ready, waiting 15s..."
              sleep 15
            fi
          done

          if [ "${SUCCESS}" = "true" ]; then
            exit 0
          fi

          echo "workers.dev probe failed — fallback: Cloudflare API script check"
          CF_API_URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/torgima"
          HTTP_CODE="$(curl -sS -o /tmp/cf-worker.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${CF_API_URL}")"
          echo "Cloudflare API status: ${HTTP_CODE}"
          if [ "${HTTP_CODE}" = "200" ]; then
            echo "✓ Worker script torgima present (workers.dev may still be propagating)"
            exit 0
          fi
          echo "✗ Worker deploy verification failed (workers.dev probe and Cloudflare API check)"
          exit 1

      - name: Verify Worker database target (api.torgima.com)
        env:
          INTERNAL_AUTH_SECRET: ${{ secrets.INTERNAL_AUTH_SECRET }}
        run: |
          set -euo pipefail
          API_BASE="https://api.torgima.com"
          echo "Probing ${API_BASE}/api/debug/db-target"
          sleep 10
          RAW="$(curl -sS -w "\n%{http_code}" --max-time 25 \
            -H "User-Agent: GitHub-Actions-Deploy-Verify/1.0" \
            -H "x-internal-auth: ${INTERNAL_AUTH_SECRET}" \
            "${API_BASE}/api/debug/db-target" || true)"
          HTTP_CODE="$(echo "${RAW}" | tail -1)"
          BODY="$(echo "${RAW}" | head -n -1)"
          echo "HTTP: ${HTTP_CODE}"
          echo "${BODY}" | head -c 4000
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "db-target probe failed (HTTP ${HTTP_CODE})"
            exit 1
          fi
          echo "${BODY}" | grep -q '"probe"' || { echo "missing probe in db-target response"; exit 1; }
          echo "✓ db-target probe returned"

      - name: Optional debug env probe (non-blocking)
        env:
          INTERNAL_AUTH_SECRET: ${{ secrets.INTERNAL_AUTH_SECRET }}
          WORKER_BASE: ${{ vars.CLOUDFLARE_WORKER_URL }}
        run: |
          BASE="${WORKER_BASE:-https://torgima.tmagaya.workers.dev}"
          curl -fsS \
            -H "User-Agent: GitHub-Actions-Deploy-Verify/1.0" \
            -H "x-internal-auth: ${INTERNAL_AUTH_SECRET}" \
            "${BASE}/api/debug/cloudflare-env" || true
          echo "Debug probe complete (failures do not block deploy)"

  deploy-pages:
    name: Deploy Frontend
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend for Pages
        run: pnpm build:cloudflare:pages
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          NODE_ENV: production

      - name: Verify frontend build
        run: |
          echo "=== Frontend dist ==="
          ls -la artifacts/torgima/dist/
          test -f artifacts/torgima/dist/index.html
          if [ ! -f artifacts/torgima/dist/_redirects ]; then
            echo "/* /index.html 200" > artifacts/torgima/dist/_redirects
            echo "Created _redirects for SPA routing"
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "."
          command: pages deploy artifacts/torgima/dist --project-name=torgima-execution --branch=main --commit-dirty=true

      - name: Verify Pages responds
        run: |
          sleep 15
          HTTP="$(curl -s -o /dev/null -w "%{http_code}" https://torgima.com || true)"
          echo "torgima.com HTTP: ${HTTP}"
          if [ "${HTTP}" = "200" ] || [ "${HTTP}" = "304" ]; then
            echo "✓ Frontend is live"
          else
            echo "⚠ Frontend returned ${HTTP} — may still be propagating"
          fi
        continue-on-error: true

  verify-connections:
    name: Verify all connections
    needs: [deploy-worker, deploy-pages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run connection validation chain
        env:
          WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
        run: pnpm run verify:deploy:connections -- --soft
