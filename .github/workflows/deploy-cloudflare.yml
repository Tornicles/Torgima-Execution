name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.torgima.com' }}
  # workers.dev bypasses zone WAF — used for CI health verification only
  WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}

jobs:
  ci:
    name: Typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          NODE_ENV: production

      - name: Run tests
        run: pnpm test
        env:
          NODE_ENV: test

      - name: Upload API build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: artifacts/api-server/dist
          retention-days: 1
          if-no-files-found: warn

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: artifacts/torgima/dist
          retention-days: 1

  # Migrations are applied manually from local machine only.
  # Never run migrations in CI. See CONTRIBUTING.md for migration workflow.

  deploy-worker:
    name: Deploy API Worker
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API Worker
        run: pnpm --filter @workspace/api-server build
        env:
          NODE_ENV: production

      - name: Validate Worker DATABASE_URL (pooler required)
        run: node scripts/validate-worker-database-url.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify Worker entry and build output
        run: |
          test -f artifacts/api-server/src/worker.ts
          ls -la artifacts/api-server/dist/ | head -20 || true
          echo "Worker entry src/worker.ts present; Wrangler bundles TypeScript at deploy."

      - name: Ensure Cloudflare Queues
        run: pnpm run ensure:cloudflare:queues -- --soft
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QUEUES_OPTIONAL: "1"

      - name: Ensure WAF skip for health and CI probes
        run: pnpm run ensure:cloudflare:waf-ci-skip -- --soft
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ZONE_NAME: torgima.com

      - name: Validate deploy credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN not set in GitHub secrets"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ERROR: CLOUDFLARE_ACCOUNT_ID not set in GitHub secrets"
            exit 1
          fi
          echo "Deploy credentials present — proceeding"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: artifacts/api-server
          command: deploy

      - name: Verify Worker responds (canonical API first)
        run: |
          set -euo pipefail
          API_BASE="${VITE_API_BASE_URL:-https://api.torgima.com}"
          HEALTH_URL="${API_BASE}/health"
          echo "Primary health URL: ${HEALTH_URL}"
          sleep 15

          SUCCESS=false
          for i in 1 2 3 4 5 6; do
            echo "--- Attempt $i ---"
            RAW="$(curl -sS -w "\n%{http_code}" --max-time 20 \
              -H "User-Agent: GitHub-Actions-Deploy-Verify/1.0" \
              "${HEALTH_URL}" || true)"
            HTTP_CODE="$(echo "${RAW}" | tail -1)"
            BODY="$(echo "${RAW}" | head -n -1)"
            echo "HTTP: ${HTTP_CODE}"
            echo "Body: ${BODY}"

            if [ "${HTTP_CODE}" = "200" ] && echo "${BODY}" | grep -q '"ok"'; then
              echo "✓ Canonical API is live"
              SUCCESS=true
              break
            fi
            if [ $i -lt 6 ]; then sleep 15; fi
          done

          if [ "${SUCCESS}" = "true" ]; then exit 0; fi

          WORKER_BASE="${WORKER_URL:-https://torgima.tmagaya.workers.dev}"
          echo "Canonical health failed — optional workers.dev fallback: ${WORKER_BASE}/health"
          RAW="$(curl -sS -w "\n%{http_code}" --max-time 15 \
            -H "User-Agent: GitHub-Actions-Deploy-Verify/1.0" \
            "${WORKER_BASE}/health" || true)"
          HTTP_CODE="$(echo "${RAW}" | tail -1)"
          BODY="$(echo "${RAW}" | head -n -1)"
          if [ "${HTTP_CODE}" = "200" ] && echo "${BODY}" | grep -q '"ok"'; then
            echo "✓ workers.dev health OK (canonical still preferred for debug probes)"
            exit 0
          fi

          echo "workers.dev probe failed — fallback: Cloudflare API script check"
          CF_API_URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/torgima"
          HTTP_CODE="$(curl -sS -o /tmp/cf-worker.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${CF_API_URL}")"
          echo "Cloudflare API status: ${HTTP_CODE}"
          if [ "${HTTP_CODE}" = "200" ]; then
            echo "✓ Worker script torgima present"
            exit 0
          fi
          echo "✗ Deploy verification failed (canonical + workers.dev + Cloudflare API)"
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
          WORKER_URL: ${{ env.WORKER_URL }}

      - name: Verify production debug probes (canonical API)
        env:
          INTERNAL_AUTH_SECRET: ${{ secrets.INTERNAL_AUTH_SECRET }}
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
          WORKER_URL: ${{ env.WORKER_URL }}
        run: node scripts/production-deploy-verify.mjs --deploy-only

      - name: Optional debug env probe (non-blocking)
        env:
          INTERNAL_AUTH_SECRET: ${{ secrets.INTERNAL_AUTH_SECRET }}
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
        run: |
          API_BASE="${VITE_API_BASE_URL:-https://api.torgima.com}"
          curl -fsS \
            -H "User-Agent: GitHub-Actions-Deploy-Verify/1.0" \
            -H "x-internal-auth: ${INTERNAL_AUTH_SECRET}" \
            "${API_BASE}/api/debug/cloudflare-env" || true
          echo "Debug probe complete (failures do not block deploy)"

  deploy-pages:
    name: Deploy Frontend
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend for Pages
        run: pnpm build:cloudflare:pages
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          NODE_ENV: production

      - name: Verify frontend build
        run: |
          echo "=== Frontend dist ==="
          ls -la artifacts/torgima/dist/
          test -f artifacts/torgima/dist/index.html
          if [ ! -f artifacts/torgima/dist/_redirects ]; then
            echo "/* /index.html 200" > artifacts/torgima/dist/_redirects
            echo "Created _redirects for SPA routing"
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "."
          command: pages deploy artifacts/torgima/dist --project-name=torgima-execution --branch=main --commit-dirty=true

      - name: Verify Pages responds
        run: |
          sleep 15
          HTTP="$(curl -s -o /dev/null -w "%{http_code}" https://torgima.com || true)"
          echo "torgima.com HTTP: ${HTTP}"
          if [ "${HTTP}" = "200" ] || [ "${HTTP}" = "304" ]; then
            echo "✓ Frontend is live"
          else
            echo "⚠ Frontend returned ${HTTP} — may still be propagating"
          fi
        continue-on-error: true

  verify-connections:
    name: Verify all connections
    needs: [deploy-worker, deploy-pages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run connection validation chain
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
          WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
        run: pnpm run verify:deploy:connections -- --soft

  production-verify:
    name: Production verification (canonical API + runtime)
    needs: [verify-connections]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate INTERNAL_AUTH_SECRET present
        env:
          INTERNAL_AUTH_SECRET: ${{ secrets.INTERNAL_AUTH_SECRET }}
        run: |
          if [ -z "${INTERNAL_AUTH_SECRET}" ]; then
            echo "Missing INTERNAL_AUTH_SECRET GitHub secret"
            exit 1
          fi
          echo "INTERNAL_AUTH_SECRET configured (value not printed)"

      - name: Run production verification
        env:
          TORGIMA_PROD_CONFIRM: "1"
          CONFIRM_PRODUCTION_SMOKE: "true"
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INTERNAL_AUTH_SECRET: ${{ secrets.INTERNAL_AUTH_SECRET }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/production-prod-verify.mjs
