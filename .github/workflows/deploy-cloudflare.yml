name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  ci:
    name: Typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build all packages
        run: pnpm build

      - name: Run unit tests
        run: pnpm test
        env:
          NODE_ENV: test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            artifacts/api-server/dist
            artifacts/torgima/dist
          retention-days: 1

  migrate:
    name: Run database migrations
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migration idempotency precheck
        run: pnpm db:migration-precheck

      - name: Run Drizzle migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run manual migrations
        run: pnpm db:apply-manual
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-worker:
    name: Deploy API Worker
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API Worker
        run: pnpm --filter @workspace/api-server build
        env:
          NODE_ENV: production

      - name: Verify Worker entry and build output
        run: |
          test -f artifacts/api-server/src/worker.ts
          ls -la artifacts/api-server/dist/ | head -20
          echo "Worker entry src/worker.ts present; Wrangler bundles TypeScript at deploy."

      - name: Ensure Cloudflare Queues
        run: pnpm run ensure:cloudflare:queues -- --soft
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QUEUES_OPTIONAL: "1"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: artifacts/api-server
          command: deploy
          secrets: |
            DATABASE_URL
            SUPABASE_URL
            SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY
            ANTHROPIC_API_KEY
            BHUDHI_MODEL
            RESEND_API_KEY
            EMAIL_FROM
            INTERNAL_AUTH_SECRET
            NOTIFICATION_UNSUBSCRIBE_SECRET
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BHUDHI_MODEL: ${{ secrets.BHUDHI_MODEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          INTERNAL_AUTH_SECRET: ${{ secrets.INTERNAL_AUTH_SECRET }}
          NOTIFICATION_UNSUBSCRIBE_SECRET: ${{ secrets.NOTIFICATION_UNSUBSCRIBE_SECRET }}

      - name: Verify API health (diagnostic)
        run: |
          set -euo pipefail
          URL="https://api.torgima.com/health"
          echo "URL checked: ${URL}"
          sleep 20

          # Use -i/-sS (not -f) so we can capture 403 bodies/headers.
          curl -i -sS \
            -H "User-Agent: GitHubActions-CI" \
            "${URL}" > /tmp/api-health.raw

          STATUS_LINE="$(head -n 1 /tmp/api-health.raw || true)"
          STATUS_CODE="$(echo "${STATUS_LINE}" | awk '{print $2}' || true)"
          echo "Status line: ${STATUS_LINE}"
          echo "Status code: ${STATUS_CODE:-unknown}"

          echo "Response headers (selected):"
          grep -iE '^(server:|cf-ray:|cf-cache-status:|content-type:|x-request-id:|x-robots-tag:|cf-mitigated:|location:)' /tmp/api-health.raw || true

          echo "Response body (first 40 lines):"
          awk 'BEGIN{inbody=0} /^\r?$/{inbody=1; next} { if(inbody) print }' /tmp/api-health.raw | head -n 40 || true

          # Determine likely source without guessing.
          if grep -qiE '^cf-ray:' /tmp/api-health.raw; then
            echo "Source: Cloudflare edge (cf-ray present)"
          else
            echo "Source: App/Worker (no cf-ray header detected)"
          fi

          # Gate deploy on a healthy 200 with JSON ok:true
          test "${STATUS_CODE}" = "200"
          awk 'BEGIN{inbody=0} /^\r?$/{inbody=1; next} { if(inbody) print }' /tmp/api-health.raw | grep -q '"ok"[[:space:]]*:[[:space:]]*true'
          echo "API health OK"

      - name: Optional debug env probe (non-blocking)
        env:
          INTERNAL_AUTH_SECRET: ${{ secrets.INTERNAL_AUTH_SECRET }}
        run: |
          curl -fsS \
            -H "User-Agent: GitHubActions-CI" \
            -H "x-internal-auth: ${INTERNAL_AUTH_SECRET}" \
            https://api.torgima.com/api/debug/cloudflare-env || true
          echo "Debug probe complete (failures do not block deploy)"

  deploy-pages:
    name: Deploy Frontend (Pages)
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        run: pnpm build:cloudflare:pages
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          NODE_ENV: production

      - name: Verify frontend build output
        run: |
          ls -la artifacts/torgima/dist/
          test -f artifacts/torgima/dist/index.html
          test -f artifacts/torgima/dist/_redirects
          echo "Frontend build verified."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "."
          command: pages deploy artifacts/torgima/dist --project-name=torgima-execution --branch=main --commit-dirty=true

      - name: Verify frontend is live
        run: |
          sleep 15
          curl -fsSI https://torgima.com | head -20
          echo "Frontend reachable."
